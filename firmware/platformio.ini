; BMO PLAYER firmware - PlatformIO project
; NOTE: library/platform versions below are the combination this code was written
; against (arduino-esp32 2.0.x + ESP32-audioI2S 2.0.x API). VERIFY they resolve on
; your machine; newer major versions of ESP32-audioI2S (3.x) changed the callback API.
[env:bmo_player]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    esphome/ESP32-audioI2S@2.0.7
